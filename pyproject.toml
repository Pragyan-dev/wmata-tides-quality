[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wmata-tides"
version = "0.1.0"
description = "WMATA bus GTFS-Realtime to TIDES, with data quality checks"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "gtfs-realtime-bindings==2.2.0",  # 3.x needs protobuf>=7; dbt needs <7
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "duckdb>=1.0",
    "dbt-duckdb>=1.9",
    "frictionless>=5.18",
    "dagster>=1.13",
    "dagster-webserver>=1.13",
    "dagster-dbt>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["collector", "orchestration"]

[tool.dagster]
module_name = "orchestration.definitions"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Long SQL strings read better unwrapped.
"scripts/report.py" = ["E501"]
"scripts/make_sample.py" = ["E501"]
