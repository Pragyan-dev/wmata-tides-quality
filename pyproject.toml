[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wmata-tides"
version = "0.1.0"
description = "WMATA bus GTFS-Realtime to TIDES, with data quality checks"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "gtfs-realtime-bindings>=1.0",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["collector"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
