version: 2

models:
  - name: stg_rt__vehicle_positions
    description: >
      One row per distinct vehicle ping (vehicle_id, vehicle_ts). Repeats of the same ping
      in later fetches are dropped; times_seen records how many fetches carried it.
      Timestamps are TIMESTAMPTZ shown in America/New_York.
    columns:
      - name: location_ping_id
        description: vehicle_id and vehicle epoch joined with a dash.
        tests: [unique, not_null]
      - name: service_date
        description: Trip start_date when on a trip, else the local date of the ping.
        tests: [not_null]
      - name: event_ts
        description: Time the vehicle reported the position.
      - name: ping_age_s
        description: Seconds between the vehicle timestamp and the fetch that first saw it.
      - name: times_seen
        description: Number of fetches that carried this exact ping.
      - name: vehicle_id
        tests: [not_null]
      - name: current_status
        tests:
          - accepted_values:
              arguments:
                values: ['INCOMING_AT', 'STOPPED_AT', 'IN_TRANSIT_TO']
      - name: trip_schedule_relationship
        tests:
          - accepted_values:
              arguments:
                values: ['SCHEDULED', 'ADDED', 'UNSCHEDULED', 'CANCELED', 'DUPLICATED']
      - name: occupancy_status
        description: WMATA defines MANY_SEATS under 25%, FEW_SEATS 25-49%, FULL 50% or more.
        tests:
          - accepted_values:
              arguments:
                values: ['EMPTY', 'MANY_SEATS_AVAILABLE', 'FEW_SEATS_AVAILABLE',
                         'STANDING_ROOM_ONLY', 'CRUSHED_STANDING_ROOM_ONLY', 'FULL',
                         'NOT_ACCEPTING_PASSENGERS', 'NO_DATA_AVAILABLE', 'NOT_BOARDABLE']
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]
      # Referential integrity to static GTFS. Severity warn: a mismatch is a data
      # quality finding (counted in data_quality), not a pipeline failure.
      - name: trip_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_gtfs__trips')
                field: trip_id
              config:
                severity: warn
      - name: route_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_gtfs__routes')
                field: route_id
              config:
                severity: warn
      - name: stop_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_gtfs__stops')
                field: stop_id
              config:
                severity: warn

  - name: stg_rt__trip_updates
    description: Last reported state for each trip and stop in TripUpdates.
    tests:
      - unique_combination:
          arguments:
            columns: [trip_id, service_date, stop_sequence]
    columns:
      - name: trip_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_gtfs__trips')
                field: trip_id
              config:
                severity: warn
      - name: last_stop_schedule_relationship
        tests:
          - accepted_values:
              arguments:
                values: ['SCHEDULED', 'SKIPPED', 'NO_DATA']

  - name: stg_collector__fetches
    description: One row per fetch attempt from the collector log, including failures.
    columns:
      - name: feed
        tests:
          - accepted_values:
              arguments:
                values: ['vehicle_positions', 'trip_updates']

  - name: stg_gtfs__feed_versions
    description: Static GTFS version downloaded on each collection date.
    columns:
      - name: collection_date
        tests: [unique, not_null]

  - name: stg_gtfs__routes
    description: GTFS routes, typed, with feed_version.
  - name: stg_gtfs__trips
    description: GTFS trips, typed, with feed_version.
    tests:
      - unique_combination:
          arguments:
            columns: [feed_version, trip_id]
  - name: stg_gtfs__stops
    description: GTFS stops, typed, with feed_version.
    tests:
      - unique_combination:
          arguments:
            columns: [feed_version, stop_id]
  - name: stg_gtfs__stop_times
    description: GTFS stop_times with times as seconds after the GTFS service day start.
    tests:
      - unique_combination:
          arguments:
            columns: [feed_version, trip_id, stop_sequence]
  - name: stg_gtfs__shapes
    description: GTFS shape points, typed, with feed_version.
  - name: stg_gtfs__calendar
    description: GTFS calendar, typed, with feed_version.
  - name: stg_gtfs__calendar_dates
    description: GTFS calendar_dates, typed, with feed_version.
